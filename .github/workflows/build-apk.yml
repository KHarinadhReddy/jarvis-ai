name: Build J.A.R.V.I.S APK

"on":
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

defaults:
  run:
    working-directory: Music/jarvis_openrouter_voice_ai/jarvis-os/android

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: Music/jarvis_openrouter_voice_ai/jarvis-os/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: J.A.R.V.I.S. Mobile v0.1.0
          files: Music/jarvis_openrouter_voice_ai/jarvis-os/android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
